<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>CITED: 100% of agents shown the creator's test bought the Winix, against 6% shown a placebo and 8% shown nothing</title>
  <!-- CITED share image: the price-matched eval (packages/evals/results/cited-price-matched).
       Rendered to public/og/cited-proof-v1.png by scripts/gen-og.ts. -->
  <rect width="1200" height="630" fill="#FAF8F4"/>
  <g font-family="Geist, ui-sans-serif, sans-serif" fill="#16181D">
    <text x="72" y="92" font-family="Newsreader, serif" font-size="24" font-weight="600" letter-spacing="3">CITED</text>
    <text x="1128" y="92" text-anchor="end" font-size="18" fill="#5B5F68">Share of agents that bought the Winix</text>
    <line x1="72" y1="118" x2="1128" y2="118" stroke="#E6E2DA" stroke-width="1.5"/>

    <text x="72" y="196" font-family="Newsreader, serif" font-size="60" font-weight="500" letter-spacing="-0.6">Pays creators on proven lift,</text>
    <text x="72" y="264" font-family="Newsreader, serif" font-size="60" font-weight="500" letter-spacing="-0.6" font-style="italic" fill="#5B5F68">not last-click cookies.</text>

    <!-- rows: label | track (x 400..1000, 600px) | value -->
    <g>
      <text x="72" y="352" font-size="24" font-weight="600">Shown the creator's test</text>
      <rect x="440" y="331" width="520" height="28" rx="3" fill="#EEEAE2"/>
      <rect x="440" y="331" width="520" height="28" rx="3" fill="#1F7A55"/>
      <text x="1128" y="354" text-anchor="end" font-size="26" font-weight="600" fill="#1F7A55">100%</text>
      <text x="1036" y="353" text-anchor="end" font-size="17" fill="#5B5F68">57/57</text>
    </g>
    <g>
      <text x="72" y="424" font-size="24" font-weight="600">Placebo, same creator</text>
      <rect x="440" y="403" width="520" height="28" rx="3" fill="#EEEAE2"/>
      <rect x="440" y="403" width="31" height="28" rx="3" fill="#B7791F"/>
      <text x="1128" y="426" text-anchor="end" font-size="26" font-weight="600">6%</text>
      <text x="1036" y="425" text-anchor="end" font-size="17" fill="#5B5F68">3/54</text>
    </g>
    <g>
      <text x="72" y="496" font-size="24" font-weight="600">Nothing shown</text>
      <rect x="440" y="475" width="520" height="28" rx="3" fill="#EEEAE2"/>
      <rect x="440" y="475" width="42" height="28" rx="3" fill="#B7791F" fill-opacity="0.55"/>
      <text x="1128" y="498" text-anchor="end" font-size="26" font-weight="600">8%</text>
      <text x="1036" y="497" text-anchor="end" font-size="17" fill="#5B5F68">3/36</text>
    </g>

    <line x1="72" y1="540" x2="1128" y2="540" stroke="#16181D" stroke-width="1.5"/>
    <text x="72" y="588" font-size="22"><tspan font-weight="700" fill="#1F7A55">+94pp</tspan><tspan> lift vs placebo · </tspan><tspan font-weight="700" fill="#1F7A55">+90.3pp</tspan><tspan> at the 80% lower bound · </tspan><tspan fill="#5B5F68">147 pre-registered, price-matched sessions</tspan></text>
  </g>
</svg>
