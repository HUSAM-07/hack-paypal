name: reseed-hosted
# Manual only. Refreshes the CITED data on the hosted worker without ever showing it empty.
#
# snapshot (default): replays the 14-beat demo against a local `wrangler dev` of pact-worker
#   inside this job, checks it against the locked numbers, exports the CITED tables as one SQL
#   file of DELETE + INSERT, and applies it to production D1 in a single
#   `wrangler d1 execute --remote --file`. D1 runs a file import as one atomic operation, so
#   visitors see the old ledger until the new one is in place. Pact's tables are never named.
# replay: the old path. Wipes the CITED tables in production, then replays the demo over the
#   network for 10+ minutes, during which the site shows empty or partial data.
#
# Either way the job then reads the hosted API and pages and fails if any locked number is off
# (62 caused, first payout $383.96, programme to date $468.43).
# Honors DEPLOY_FREEZE (repo variable): while it is "true", only `force: true` runs this.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: snapshot (atomic swap) or replay (old, leaves the site empty for 10+ min)
        type: choice
        options: [snapshot, replay]
        default: snapshot
      force:
        description: Run even while DEPLOY_FREEZE is true
        type: boolean
        default: false
jobs:
  reseed:
    runs-on: ubuntu-latest
    environment: production
    concurrency: { group: deploy-production, cancel-in-progress: false }
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Respect the deploy freeze
        if: vars.DEPLOY_FREEZE == 'true' && !inputs.force
        run: |
          echo "::error::DEPLOY_FREEZE is true: the hosted demo is frozen. Re-run with force: true to reseed anyway."
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci

      - name: Build the snapshot on a local worker
        if: inputs.mode != 'replay'
        # Keyless and local: the replay's worker gets CITED_OPEN_API=1 on the command line only.
        run: |
          mkdir -p apps/web/dist
          node apps/worker/scripts/cited-snapshot.mjs --out cited-snapshot.sql
      - name: Keep the snapshot
        if: inputs.mode != 'replay'
        uses: actions/upload-artifact@v4
        with: { name: cited-snapshot, path: cited-snapshot.sql, retention-days: 30 }
      - name: Note the restore point
        # If anything looks wrong afterwards:
        #   npx wrangler d1 time-travel restore pact --bookmark <this bookmark>
        working-directory: apps/worker
        continue-on-error: true
        run: npx wrangler d1 time-travel info pact
      - name: Swap the CITED tables in one atomic import
        if: inputs.mode != 'replay'
        working-directory: apps/worker
        run: npx wrangler d1 execute pact --remote --yes --file ../../cited-snapshot.sql

      - name: Wipe the CITED ledger (replay mode)
        if: inputs.mode == 'replay'
        working-directory: apps/worker
        run: |
          npx wrangler d1 execute pact --remote --command "
            DELETE FROM credits; DELETE FROM review_flags; DELETE FROM payout_batches;
            DELETE FROM deposit_refunds; DELETE FROM deposits; DELETE FROM brand_statements;
            DELETE FROM refunds; DELETE FROM sales; DELETE FROM orders; DELETE FROM agent_sessions;
            DELETE FROM webhook_events; DELETE FROM creator_tests; DELETE FROM listings;
            DELETE FROM creators; DELETE FROM brands; DELETE FROM clock;
            DELETE FROM cited_agent_runs; DELETE FROM cited_live_runs;"
      - name: Replay the demo against the deployed worker (replay mode)
        if: inputs.mode == 'replay'
        # The hosted worker locks CITED writes; the demo runner sends this as its bearer token.
        env:
          CITED_API_TOKEN: ${{ secrets.CITED_API_TOKEN }}
        run: >-
          npm run demo:cited -- --use-running
          --engine-url "${{ vars.DEPLOY_URL }}/api/cited"
          --catalogue-url "${{ vars.DEPLOY_URL }}/catalogue"
          --out runs.jsonl
      - name: Load the console's run records (replay mode)
        if: inputs.mode == 'replay'
        working-directory: apps/worker
        run: |
          node scripts/runs-to-sql.mjs ../../runs.jsonl > ../../runs.sql
          npx wrangler d1 execute pact --remote --yes --file ../../runs.sql

      - name: Verify the hosted data
        run: node apps/worker/scripts/verify-cited.mjs "${{ vars.DEPLOY_URL }}"
