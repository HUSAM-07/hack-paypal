name: reseed-hosted
# Manual only. Wipes the CITED tables in the production D1 (never Pact's) and replays the
# scripted demo against the deployed worker, so the hosted console shows the current beats.
# The demo runner exits non-zero if any ledger==PayPal check fails or the numbers drift
# from the card.
on: workflow_dispatch
jobs:
  reseed:
    runs-on: ubuntu-latest
    environment: production
    concurrency: { group: deploy-production, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Wipe the CITED ledger (production D1)
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute pact --remote --command "
            DELETE FROM credits; DELETE FROM review_flags; DELETE FROM payout_batches;
            DELETE FROM deposit_refunds; DELETE FROM deposits; DELETE FROM refunds;
            DELETE FROM sales; DELETE FROM orders; DELETE FROM agent_sessions;
            DELETE FROM webhook_events; DELETE FROM listings; DELETE FROM creators;
            DELETE FROM brands; DELETE FROM clock; DELETE FROM cited_agent_runs;
            DELETE FROM cited_live_runs;"
      - name: Replay the demo against the deployed worker
        # The hosted worker locks CITED writes; the demo runner sends this as its bearer token.
        env:
          CITED_API_TOKEN: ${{ secrets.CITED_API_TOKEN }}
        run: >-
          npm run demo:cited -- --use-running
          --engine-url "${{ vars.DEPLOY_URL }}/api/cited"
          --catalogue-url "${{ vars.DEPLOY_URL }}/catalogue"
      - name: Smoke test
        run: |
          curl -fsS "${{ vars.DEPLOY_URL }}/api/cited/api/shapley" | head -c 400; echo
