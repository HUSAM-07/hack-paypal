name: reseed-hosted
# Manual, plus an hourly safety net (snapshot mode). Refreshes the CITED data on the hosted worker without ever showing it empty.
# Runs once per deploy target (workers-dev, shipwith: see apps/worker/scripts/deploy.mjs), each in
# its own GitHub environment and Cloudflare account. A manual run can pick one target.
#
# snapshot (default): replays the 14-beat demo against a local `wrangler dev` of pact-worker
#   inside this job, checks it against the locked numbers, exports the CITED tables as one SQL
#   file of DELETE + INSERT, and applies it to production D1 in a single
#   `wrangler d1 execute --remote --file`. D1 runs a file import as one atomic operation, so
#   visitors see the old ledger until the new one is in place. Pact's tables are never named.
# replay: the old path. Wipes the CITED tables in production, then replays the demo over the
#   network for 10+ minutes, during which the site shows empty or partial data.
#
# Either way the job then reads the hosted API and pages and fails if any locked number is off
# (62 caused, first payout $383.96, programme to date $468.43).
# Honors DEPLOY_FREEZE (repo variable): while it is "true", only `force: true` runs this.
#
# Hourly: Studio's buttons can no longer change the shared ledger (a visitor's Approve, Release and
# Void stay in their own cookie), so this only restores the locked numbers if something else moved
# them. A scheduled run has no inputs, so it takes snapshot mode; under DEPLOY_FREEZE it is skipped.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      target:
        description: Reseed target
        type: choice
        options: [all, workers-dev, shipwith]
        default: all
      mode:
        description: snapshot (atomic swap) or replay (old, leaves the site empty for 10+ min)
        type: choice
        options: [snapshot, replay]
        default: snapshot
      force:
        description: Run even while DEPLOY_FREEZE is true
        type: boolean
        default: false
jobs:
  reseed:
    # The hourly run honours the freeze quietly; a manual run says why it stopped (next step).
    if: github.event_name != 'schedule' || vars.DEPLOY_FREEZE != 'true'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.target && inputs.target != 'all' && format('["{0}"]', inputs.target) || '["workers-dev","shipwith"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Same environment and lock as that target's deploy in ci.yml, so a reseed never races a deploy.
    environment: ${{ matrix.target == 'workers-dev' && 'production' || matrix.target }}
    concurrency:
      group: ${{ matrix.target == 'workers-dev' && 'deploy-production' || format('deploy-{0}', matrix.target) }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEPLOY_URL: ${{ vars.DEPLOY_URL }}
    steps:
      - name: Respect the deploy freeze
        if: vars.DEPLOY_FREEZE == 'true' && !inputs.force
        run: |
          echo "::error::DEPLOY_FREEZE is true: the hosted demo is frozen. Re-run with force: true to reseed anyway."
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # Every remote D1 command below goes to this target's database. deploy.mjs refuses if the
      # environment's CLOUDFLARE_ACCOUNT_ID belongs to another target.
      - name: Resolve the target's wrangler config
        run: |
          : "${DEPLOY_URL:?Set the DEPLOY_URL variable on this environment}"
          cfg=$(node apps/worker/scripts/deploy.mjs ${{ matrix.target }} --print-config)
          echo "WRANGLER_CONFIG=$cfg" >> "$GITHUB_ENV"

      - name: Build the snapshot on a local worker
        if: inputs.mode != 'replay'
        # Keyless and local: the replay's worker gets CITED_OPEN_API=1 on the command line only.
        run: |
          mkdir -p apps/web/dist
          node apps/worker/scripts/cited-snapshot.mjs --out cited-snapshot.sql
      - name: Keep the snapshot
        if: inputs.mode != 'replay'
        uses: actions/upload-artifact@v4
        with: { name: 'cited-snapshot-${{ matrix.target }}', path: cited-snapshot.sql, retention-days: 30 }
      - name: Note the restore point
        # If anything looks wrong afterwards:
        #   npx wrangler d1 time-travel restore pact --bookmark <this bookmark> --config <that config>
        working-directory: apps/worker
        continue-on-error: true
        run: npx wrangler d1 time-travel info pact --config "$WRANGLER_CONFIG"
      - name: Swap the CITED tables in one atomic import
        if: inputs.mode != 'replay'
        working-directory: apps/worker
        run: npx wrangler d1 execute pact --remote --yes --config "$WRANGLER_CONFIG" --file ../../cited-snapshot.sql

      - name: Wipe the CITED ledger (replay mode)
        if: inputs.mode == 'replay'
        working-directory: apps/worker
        run: |
          npx wrangler d1 execute pact --remote --config "$WRANGLER_CONFIG" --command "
            DELETE FROM credits; DELETE FROM review_flags; DELETE FROM payout_batches;
            DELETE FROM deposit_refunds; DELETE FROM deposits; DELETE FROM brand_statements;
            DELETE FROM refunds; DELETE FROM sales; DELETE FROM orders; DELETE FROM agent_sessions;
            DELETE FROM webhook_events; DELETE FROM creator_tests; DELETE FROM listings;
            DELETE FROM creators; DELETE FROM brands; DELETE FROM clock;
            DELETE FROM cited_agent_runs; DELETE FROM cited_live_runs;"
      - name: Replay the demo against the deployed worker (replay mode)
        if: inputs.mode == 'replay'
        # The hosted worker locks CITED writes; the demo runner sends this as its bearer token.
        env:
          CITED_API_TOKEN: ${{ secrets.CITED_API_TOKEN }}
        run: >-
          npm run demo:cited -- --use-running
          --engine-url "$DEPLOY_URL/api/cited"
          --catalogue-url "$DEPLOY_URL/catalogue"
          --out runs.jsonl
      - name: Load the console's run records (replay mode)
        if: inputs.mode == 'replay'
        working-directory: apps/worker
        run: |
          node scripts/runs-to-sql.mjs ../../runs.jsonl > ../../runs.sql
          npx wrangler d1 execute pact --remote --yes --config "$WRANGLER_CONFIG" --file ../../runs.sql

      - name: Verify the hosted data
        run: node apps/worker/scripts/verify-cited.mjs "$DEPLOY_URL"
