name: ci
on:
  push: { branches: [main] }
  pull_request:
  # Manual deploy of main, the only way to deploy while DEPLOY_FREEZE is true (with force).
  workflow_dispatch:
    inputs:
      force:
        description: Deploy even while DEPLOY_FREEZE is true
        type: boolean
        default: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run evals -- --dry

  # CD: every green push to main deploys pact-worker (web build + D1 migrations + worker),
  # unless the repo variable DEPLOY_FREEZE is "true" (the judging window): then only a manual
  # run of this workflow on main with force: true deploys.
  deploy:
    needs: check
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production
    # Never run two deploys at once; a newer push waits for the current one.
    concurrency: { group: deploy-production, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
      - name: Skip if frozen or no longer the newest main
        id: latest
        # Deploys queue; an older commit finishing last would roll production back.
        # While DEPLOY_FREEZE is "true", only a forced manual run deploys; a push is skipped.
        env:
          FREEZE: ${{ vars.DEPLOY_FREEZE }}
          FORCED: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: |
          if [ "$FREEZE" = "true" ] && [ "$FORCED" != "true" ]; then
            echo "::warning::DEPLOY_FREEZE is true: not deploying. Run ci manually on main with force: true to deploy anyway."
            echo "stale=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          newest=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$newest" != "$GITHUB_SHA" ]; then
            echo "main moved on to $newest; leaving the deploy to that run"
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.latest.outputs.stale != 'true'
        with: { node-version: 22, cache: npm }
      - run: npm ci
        if: steps.latest.outputs.stale != 'true'
      - name: Refuse a config that opens CITED writes
        if: steps.latest.outputs.stale != 'true'
        run: |
          if grep -q CITED_OPEN_API apps/worker/wrangler.jsonc; then
            echo "CITED_OPEN_API is local-only; remove it from apps/worker/wrangler.jsonc" >&2
            exit 1
          fi
      - name: Push worker secrets
        if: steps.latest.outputs.stale != 'true'
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CITED_API_TOKEN: ${{ secrets.CITED_API_TOKEN }}
          AG_STUDIO_LICENSE_KEY: ${{ secrets.AG_STUDIO_LICENSE_KEY }}
          AG_GRID_LICENSE_KEY: ${{ secrets.AG_GRID_LICENSE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # Each only when set; values go through stdin and are never echoed.
        run: |
          for name in CITED_API_TOKEN AG_STUDIO_LICENSE_KEY AG_GRID_LICENSE_KEY ANTHROPIC_API_KEY; do
            if [ -n "${!name}" ]; then
              printf "%s" "${!name}" | npx wrangler secret put "$name" >/dev/null
              echo "pushed $name"
            else
              echo "skipped $name (not set)"
            fi
          done
      - run: npm run deploy -w @pact/worker
        if: steps.latest.outputs.stale != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke test
        if: steps.latest.outputs.stale != 'true'
        run: curl -fsS "${{ vars.DEPLOY_URL }}/api/cited/health"
